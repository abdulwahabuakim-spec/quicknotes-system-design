<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header><h1>QuickNotes</h1><p>API Client Demo using JSONPlaceholder</p></header>
  <main>
    <section>
      <button id="load-btn">Load notes</button>
      <p id="status" role="status"></p>
    </section>
    <section>
      <h2>Create a new note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (required, max 100 chars)</label>
          <input type="text" id="title-input" maxlength="100" placeholder="Enter note title" required>
        </div>
        <div class="form-group">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="4" placeholder="Enter note body"></textarea>
        </div>
        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>
    <section><h2>Notes</h2><ul id="notes-list"></ul></section>
  </main>
</body>
  </html>
